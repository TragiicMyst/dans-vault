name: Dan's Vault Pokemon Centre UK Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pokemon-center/trigger.txt'

concurrency:
  group: dans-vault-pokemon-centre-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate monitor
        run: node --check pokemon-center/pokemon-center-monitor.mjs

      - name: Run Pokemon Centre UK monitor
        env:
          POKEMON_CENTRE_WEBHOOK_URL: ${{ secrets.POKEMON_CENTRE_WEBHOOK_URL }}
        run: node pokemon-center/pokemon-center-monitor.mjs

      - name: Save monitor state
        if: always()
        run: |
          set -e
          git config user.name "Dan's Vault Pokemon Centre Radar"
          git config user.email "actions@users.noreply.github.com"
          git add pokemon-center/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Pokemon Centre radar state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
