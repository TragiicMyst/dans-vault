name: Dan's Vault Pokemon Centre UK Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pokemon-center/trigger.txt'

concurrency:
  group: dans-vault-pokemon-centre-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate monitor
        run: node --check pokemon-center/pokemon-center-monitor.mjs

      - name: Run Pokemon Centre UK monitor
        env:
          POKEMON_CENTRE_WEBHOOK_URL: ${{ secrets.POKEMON_CENTRE_WEBHOOK_URL }}
        run: node pokemon-center/pokemon-center-monitor.mjs

      - name: Save monitor state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const path = 'pokemon-center/state.json';
          const local = fs.readFileSync(path, 'utf8');
          const encoded = Buffer.from(local, 'utf8').toString('base64');
          const endpoint = `https://api.github.com/repos/${repo}/contents/${path}`;
          const headers = {
            authorization: `Bearer ${token}`,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
            'content-type': 'application/json',
            'user-agent': 'dans-vault-pokemon-centre-radar'
          };

          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let lastError = null;

          for (let attempt = 1; attempt <= 5; attempt++) {
            try {
              const currentResponse = await fetch(`${endpoint}?ref=main`, { headers });
              if (!currentResponse.ok) throw new Error(`state GET HTTP ${currentResponse.status}`);
              const current = await currentResponse.json();
              const remote = Buffer.from(String(current.content || '').replace(/\n/g, ''), 'base64').toString('utf8');

              if (remote === local) {
                console.log('Pokemon Centre state already current.');
                process.exit(0);
              }

              const updateResponse = await fetch(endpoint, {
                method: 'PUT',
                headers,
                body: JSON.stringify({
                  message: 'Update Pokemon Centre radar state',
                  content: encoded,
                  sha: current.sha,
                  branch: 'main'
                })
              });

              if (updateResponse.ok) {
                console.log(`Pokemon Centre state saved on attempt ${attempt}.`);
                process.exit(0);
              }

              const body = await updateResponse.text();
              lastError = new Error(`state PUT HTTP ${updateResponse.status}: ${body.slice(0, 300)}`);
              if (![409, 422, 500, 502, 503, 504].includes(updateResponse.status)) throw lastError;
            } catch (error) {
              lastError = error;
            }

            console.warn(`State save attempt ${attempt} failed: ${lastError?.message}`);
            await wait(attempt * 1500);
          }

          throw lastError || new Error('Unable to save Pokemon Centre state');
          NODE
