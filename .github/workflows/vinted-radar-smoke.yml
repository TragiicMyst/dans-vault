name: Dan's Vault Vinted Radar Live Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'vinted-radar/smoke-trigger.txt'
      - 'vinted-radar/probe-vinted.mjs'
      - '.github/workflows/vinted-radar-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate permanent radar v6
        id: validation
        continue-on-error: true
        run: |
          set +e
          : > /tmp/validation.log
          node --check vinted-radar/fetch-guard.mjs >>/tmp/validation.log 2>&1; a=$?
          node --check vinted-radar/radar-v6.mjs >>/tmp/validation.log 2>&1; b=$?
          node --check vinted-radar/run-bot.mjs >>/tmp/validation.log 2>&1; c=$?
          node --check vinted-radar/radar-selftest.mjs >>/tmp/validation.log 2>&1; d=$?
          node vinted-radar/radar-selftest.mjs >>/tmp/validation.log 2>&1; e=$?
          cat /tmp/validation.log
          if [ $a -eq 0 ] && [ $b -eq 0 ] && [ $c -eq 0 ] && [ $d -eq 0 ] && [ $e -eq 0 ]; then code=0; else code=1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose both Discord webhooks
        id: discord
        continue-on-error: true
        env:
          TRAINERS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLOTHING_WEBHOOK: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
        run: |
          set +e
          trainer_present=0; clothing_present=0
          [ -n "$TRAINERS_WEBHOOK" ] && trainer_present=1
          [ -n "$CLOTHING_WEBHOOK" ] && clothing_present=1
          trainer_get=0; clothing_get=0; trainer_post=0; clothing_post=0
          if [ $trainer_present -eq 1 ]; then
            trainer_get=$(curl -sS -o /tmp/trainers-get.json -w '%{http_code}' "$TRAINERS_WEBHOOK" || echo 000)
            trainer_post=$(curl -sS -o /tmp/trainers-discord.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"content":"✅ Dan’s Vault TRAINER radar v6 smoke test — Discord delivery confirmed."}' "${TRAINERS_WEBHOOK}?wait=true" || echo 000)
          fi
          if [ $clothing_present -eq 1 ]; then
            clothing_get=$(curl -sS -o /tmp/clothing-get.json -w '%{http_code}' "$CLOTHING_WEBHOOK" || echo 000)
            clothing_post=$(curl -sS -o /tmp/clothing-discord.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"content":"✅ Dan’s Vault CLOTHING radar v6 smoke test — Discord delivery confirmed."}' "${CLOTHING_WEBHOOK}?wait=true" || echo 000)
          fi
          echo "trainer_present=$trainer_present" >> "$GITHUB_OUTPUT"
          echo "clothing_present=$clothing_present" >> "$GITHUB_OUTPUT"
          echo "trainer_get=$trainer_get" >> "$GITHUB_OUTPUT"
          echo "clothing_get=$clothing_get" >> "$GITHUB_OUTPUT"
          echo "trainer_post=$trainer_post" >> "$GITHUB_OUTPUT"
          echo "clothing_post=$clothing_post" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe live Vinted catalogue responses
        id: probe
        continue-on-error: true
        run: |
          set +e
          node vinted-radar/probe-vinted.mjs > /tmp/probe.log 2>&1
          code=$?
          cat /tmp/probe.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run one live trainer v6 scan
        id: trainers
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: smoke-trainer-state.json
        run: |
          set +e
          cp vinted-radar/state.json vinted-radar/smoke-trainer-state.json
          node vinted-radar/run-bot.mjs > /tmp/trainers-scan.log 2>&1
          code=$?
          cat /tmp/trainers-scan.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run one live clothing v6 scan
        id: clothing
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
          BOT_TYPE: clothing
          STATE_NAME: smoke-clothing-state.json
        run: |
          set +e
          cp vinted-radar/clothing-state.json vinted-radar/smoke-clothing-state.json
          node vinted-radar/run-bot.mjs > /tmp/clothing-scan.log 2>&1
          code=$?
          cat /tmp/clothing-scan.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist smoke result
        if: ${{ always() }}
        env:
          VALIDATION_CODE: ${{ steps.validation.outputs.code }}
          PROBE_CODE: ${{ steps.probe.outputs.code }}
          TRAINER_PRESENT: ${{ steps.discord.outputs.trainer_present }}
          CLOTHING_PRESENT: ${{ steps.discord.outputs.clothing_present }}
          TRAINER_GET: ${{ steps.discord.outputs.trainer_get }}
          CLOTHING_GET: ${{ steps.discord.outputs.clothing_get }}
          TRAINER_POST: ${{ steps.discord.outputs.trainer_post }}
          CLOTHING_POST: ${{ steps.discord.outputs.clothing_post }}
          TRAINER_CODE: ${{ steps.trainers.outputs.code }}
          CLOTHING_CODE: ${{ steps.clothing.outputs.code }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const readJson = p => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
          const readText = p => { try { return fs.readFileSync(p,'utf8').slice(-5000); } catch { return null; } };
          const n = (v, fallback=999) => v === undefined || v === '' ? fallback : Number(v);
          const trainer = readJson('vinted-radar/smoke-trainer-state.json');
          const clothing = readJson('vinted-radar/smoke-clothing-state.json');
          const discordTrainer = readJson('/tmp/trainers-discord.json');
          const discordClothing = readJson('/tmp/clothing-discord.json');
          const result = {
            at: new Date().toISOString(),
            validationExitCode: n(process.env.VALIDATION_CODE),
            validationLogTail: readText('/tmp/validation.log'),
            probeExitCode: n(process.env.PROBE_CODE),
            probe: readJson('vinted-radar/probe-result.json'),
            trainerSecretPresent: process.env.TRAINER_PRESENT === '1',
            clothingSecretPresent: process.env.CLOTHING_PRESENT === '1',
            trainerDiscordGetHttp: process.env.TRAINER_GET || null,
            clothingDiscordGetHttp: process.env.CLOTHING_GET || null,
            trainerDiscordPostHttp: process.env.TRAINER_POST || null,
            clothingDiscordPostHttp: process.env.CLOTHING_POST || null,
            trainerDiscordMessageId: discordTrainer?.id ?? null,
            clothingDiscordMessageId: discordClothing?.id ?? null,
            trainerExitCode: n(process.env.TRAINER_CODE),
            clothingExitCode: n(process.env.CLOTHING_CODE),
            trainerDiagnostics: trainer?.diagnostics ?? null,
            clothingDiagnostics: clothing?.diagnostics ?? null,
            trainerLastAttemptAt: trainer?.freshness?.lastAttemptAt ?? null,
            clothingLastAttemptAt: clothing?.freshness?.lastAttemptAt ?? null,
            trainerScanLogTail: readText('/tmp/trainers-scan.log'),
            clothingScanLogTail: readText('/tmp/clothing-scan.log')
          };
          fs.writeFileSync('vinted-radar/smoke-result.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          git config user.name "Dan's Vault Radar Smoke"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/smoke-result.json vinted-radar/probe-result.json
          git commit -m "Record live Vinted radar v6 smoke result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
