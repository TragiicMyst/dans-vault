name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Nike Trainers Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          # GitHub Actions schedules have a 5-minute minimum. The workflow
          # itself stays alive and scans every 30 seconds for continuous radar coverage.
          deadline=$((SECONDS + 295))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Trainers radar cycle $cycle ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then
              sleep $remaining
            fi
          done

      - name: Save trainers radar state
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/state.json
          if git diff --cached --quiet; then
            echo "No trainer state changes."
            exit 0
          fi

          git commit -m "Update Nike trainers radar state"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Trainer radar state pushed successfully."
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "Could not push trainer radar state after 5 attempts."
          exit 1
