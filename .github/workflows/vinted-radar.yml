name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '1-59/5 * * * *'
  push:
    paths:
      - 'vinted-radar/run-bot.mjs'
      - 'vinted-radar/monitor.mjs'
      - 'vinted-radar/config.json'
      - '.github/workflows/vinted-radar.yml'
      - '.github/workflows/vinted-clothing.yml'

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate trainers Discord webhook silently
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ Trainers Discord webhook secret is missing."
            exit 1
          fi
          curl --fail --silent --show-error "$DISCORD_WEBHOOK_URL" >/dev/null
          echo "✅ Trainers Discord webhook is valid."

      - name: Configure live trainer alerts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          monitor = Path('vinted-radar/monitor.mjs')
          s = monitor.read_text()

          old_alert_block = """      if (shouldAlert) {
        qualifying.push({
          searchName: search.name,
          item,
          size,
          condition,
          resale,
          netProfit: profit,
          roi,
          buyScore: score,
          fakeRisk: risk,
          demand,
          strategy,
          exceptionalDeal: exceptional
        });
      }
"""
          new_alert_block = """      if (shouldAlert) {
        const alert = {
          searchName: search.name,
          item,
          size,
          condition,
          resale,
          netProfit: profit,
          roi,
          buyScore: score,
          fakeRisk: risk,
          demand,
          strategy,
          exceptionalDeal: exceptional
        };
        qualifying.push(alert);
        await sendDiscord(webhook, alert);
      }
"""
          if old_alert_block not in s:
              raise SystemExit('Could not enable live alert dispatch: alert block not found')
          s = s.replace(old_alert_block, new_alert_block, 1)

          old_batch = """qualifying.sort((a, b) => Number(b.exceptionalDeal) - Number(a.exceptionalDeal) || b.buyScore - a.buyScore || b.netProfit - a.netProfit);
for (const d of qualifying.slice(0, Number(config.maxAlertsPerRun ?? 10))) await sendDiscord(webhook, d);
"""
          new_batch = """// Alerts are sent immediately when each fresh bargain is detected above.
qualifying.sort((a, b) => Number(b.exceptionalDeal) - Number(a.exceptionalDeal) || b.buyScore - a.buyScore || b.netProfit - a.netProfit);
"""
          if old_batch not in s:
              raise SystemExit('Could not disable end-of-scan alert batch: batch block not found')
          s = s.replace(old_batch, new_batch, 1)
          monitor.write_text(s)

          runner = Path('vinted-radar/run-bot.mjs')
          r = runner.read_text()
          old_fresh = "maxAgeMinutes: 60, itemsPerSearch: 80"
          new_fresh = "maxAgeMinutes: bot === 'trainers' ? 10 : 60, itemsPerSearch: 80"
          if old_fresh not in r:
              raise SystemExit('Could not set trainer live freshness window')
          runner.write_text(r.replace(old_fresh, new_fresh, 1))
          print('✅ Live trainer alerts enabled: immediate Discord dispatch + 10-minute backlog guard.')
          PY

      - name: Run Nike Trainers Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "=== Fast trainers validation scan ==="
            node vinted-radar/run-bot.mjs
            exit 0
          fi

          deadline=$((SECONDS + 260))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Trainers radar cycle $cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $remaining; fi
          done

      - name: Save trainers radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          cp vinted-radar/state.json /tmp/trainers-state.json

          for attempt in 1 2 3 4 5; do
            echo "State save attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trainers-state.json vinted-radar/state.json
            git add vinted-radar/state.json

            if git diff --cached --quiet; then
              echo "No trainer state changes to save."
              exit 0
            fi

            git commit -m "Update Nike trainers radar state"
            if git push origin HEAD:main; then
              echo "✅ Trainer radar state saved."
              exit 0
            fi

            echo "Push raced another workflow; retrying from newest main."
            sleep 2
          done

          echo "❌ Could not save trainer radar state after 5 attempts."
          exit 1
