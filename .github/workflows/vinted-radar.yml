name: Dan's Vault Nike Trainers Radar

on:
  push:
    paths:
      - 'vinted-radar/*.mjs'
      - 'vinted-radar/config.json'
      - '.github/workflows/vinted-radar.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate radar v6, discovery, seller safety and alert balance
        run: |
          set -e
          node --check vinted-radar/fetch-guard.mjs
          node --check vinted-radar/radar-v6.mjs
          node --check vinted-radar/expanded-trainer-radar.mjs
          node --check vinted-radar/trainer-discovery-hardening.mjs
          node --check vinted-radar/condition-tier-expansion.mjs
          node --check vinted-radar/condition-fallback.mjs
          node --check vinted-radar/seller-safety.mjs
          node --check vinted-radar/trainer-alert-balance.mjs
          node --check vinted-radar/condition-channel-routing.mjs
          node --check vinted-radar/run-bot.mjs
          node --check vinted-radar/radar-selftest.mjs
          node --check vinted-radar/trainer-discovery-selftest.mjs
          node --check vinted-radar/seller-safety-selftest.mjs
          node --check vinted-radar/trainer-alert-balance-selftest.mjs
          node --check vinted-radar/condition-channel-selftest.mjs
          node vinted-radar/radar-selftest.mjs
          node vinted-radar/trainer-discovery-selftest.mjs
          node vinted-radar/seller-safety-selftest.mjs
          node vinted-radar/trainer-alert-balance-selftest.mjs
          node vinted-radar/condition-channel-selftest.mjs

      - name: Validate trainers Discord webhooks
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL }}
          DISCORD_NEW_WITH_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL }}
          DISCORD_VERY_GOOD_WEBHOOK_URL: ${{ secrets.DISCORD_VERY_GOOD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          test -n "$DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL"
          test -n "$DISCORD_NEW_WITH_TAGS_WEBHOOK_URL"
          test -n "$DISCORD_VERY_GOOD_WEBHOOK_URL"
          curl --fail --silent --show-error "$DISCORD_WEBHOOK_URL" >/dev/null
          curl --fail --silent --show-error "$DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL" >/dev/null
          curl --fail --silent --show-error "$DISCORD_NEW_WITH_TAGS_WEBHOOK_URL" >/dev/null
          curl --fail --silent --show-error "$DISCORD_VERY_GOOD_WEBHOOK_URL" >/dev/null

      - name: One-time Discord channel health check
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Verify Discord condition channels' }}
        env:
          DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL }}
          DISCORD_NEW_WITH_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL }}
          DISCORD_VERY_GOOD_WEBHOOK_URL: ${{ secrets.DISCORD_VERY_GOOD_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"content":"✅ Dan’s Vault trainer radar health check — NEW WITHOUT TAGS channel connected."}' "$DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL" >/dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"content":"✅ Dan’s Vault trainer radar health check — NEW WITH TAGS channel connected."}' "$DISCORD_NEW_WITH_TAGS_WEBHOOK_URL" >/dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"content":"✅ Dan’s Vault trainer radar health check — VERY GOOD channel connected."}' "$DISCORD_VERY_GOOD_WEBHOOK_URL" >/dev/null

      - name: Run trainers radar repeatedly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL }}
          DISCORD_NEW_WITH_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL }}
          DISCORD_VERY_GOOD_WEBHOOK_URL: ${{ secrets.DISCORD_VERY_GOOD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          deadline=$((SECONDS + 145))
          successes=0
          failures=0
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            cycle_start=$SECONDS
            echo "=== Trainer scan cycle $cycle ==="
            if timeout 70s node vinted-radar/run-bot.mjs; then
              successes=$((successes + 1))
              node -e "const s=require('./vinted-radar/state.json'); const d=s.diagnostics||{}; console.log('Trainer v6 OK:', s.freshness?.lastScanAt, 'attempt:', s.freshness?.lastAttemptAt, 'selected:', d.successfulSearches ?? '?', '/', d.selectedSearches?.length ?? '?', 'markers:', d.catalogMarkers ?? '?', 'parsed:', d.catalogItems ?? '?', 'fresh:', d.freshItems ?? '?', 'detailFetches:', d.detailFetches ?? 0, 'sellerRiskRejects:', d.rejects?.['seller-risk'] ?? 0, 'af1NwtBalanced:', d.rejects?.['model-cooldown'] ?? 0, 'delivered:', d.deliveredAlerts ?? '?', 'pending:', d.pendingDeliveries ?? '?', 'healthy:', d.healthyScan ?? '?')"
            else
              rc=$?
              failures=$((failures + 1))
              if [ $rc -eq 124 ]; then
                echo "Trainer scan cycle $cycle TIMED OUT after 70s; continuing to next cycle."
              else
                echo "Trainer scan cycle $cycle FAILED with exit code $rc."
              fi
            fi
            elapsed=$((SECONDS - cycle_start))
            wait=$((30 - elapsed))
            if [ $wait -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $wait; fi
          done
          echo "Trainer cycles complete: $successes successful, $failures failed."
          if [ $successes -eq 0 ] || [ $failures -gt $successes ]; then
            echo "Trainer radar reliability threshold failed."
            exit 1
          fi

      - name: Save trainers radar state safely
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          cp vinted-radar/state.json /tmp/trainers-state.json
          node <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/trainers-state.json', 'utf8'));
          const d = s.diagnostics || {};
          const health = {
            generatedAt: new Date().toISOString(),
            stateUpdatedAt: s.updatedAt ?? null,
            lastAttemptAt: s.freshness?.lastAttemptAt ?? null,
            lastScanAt: s.freshness?.lastScanAt ?? null,
            cooldownUntil: s.cooldownUntil ?? null,
            healthyScan: d.healthyScan ?? false,
            healthReason: d.healthReason ?? null,
            selectedSearches: d.selectedSearches ?? [],
            successfulSearches: d.successfulSearches ?? 0,
            failedSearches: d.failedSearches ?? 0,
            catalogMarkers: d.catalogMarkers ?? 0,
            catalogItems: d.catalogItems ?? 0,
            candidateItems: d.candidateItems ?? 0,
            freshItems: d.freshItems ?? 0,
            qualifyingAlerts: d.qualifyingAlerts ?? 0,
            deliveredAlerts: d.deliveredAlerts ?? 0,
            discordFailures: d.discordFailures ?? 0,
            pendingDeliveries: d.pendingDeliveries ?? 0,
            detailFetches: d.detailFetches ?? 0,
            rejects: d.rejects ?? {},
            failures: d.failures ?? {}
          };
          fs.writeFileSync('/tmp/trainers-health.json', JSON.stringify(health, null, 2) + '\n');
          NODE

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ -f vinted-radar/state.json ]; then
              if node -e "const fs=require('fs'); const l=JSON.parse(fs.readFileSync('/tmp/trainers-state.json','utf8')); const r=JSON.parse(fs.readFileSync('vinted-radar/state.json','utf8')); const lt=Date.parse(l.updatedAt||l.freshness?.lastAttemptAt||l.freshness?.lastScanAt||0); const rt=Date.parse(r.updatedAt||r.freshness?.lastAttemptAt||r.freshness?.lastScanAt||0); process.exit(Number.isFinite(rt)&&Number.isFinite(lt)&&rt>lt?0:1)"; then
                echo "Remote trainer state is newer; refusing stale overwrite."
                exit 0
              fi
            fi

            cp /tmp/trainers-state.json vinted-radar/state.json
            cp /tmp/trainers-health.json vinted-radar/trainer-health.json
            git add vinted-radar/state.json vinted-radar/trainer-health.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Nike trainers radar state"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
