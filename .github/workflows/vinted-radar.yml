name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '1-59/5 * * * *'
  push:
    paths:
      - 'vinted-radar/run-bot.mjs'
      - 'vinted-radar/monitor.mjs'
      - 'vinted-radar/config.json'
      - '.github/workflows/vinted-radar.yml'
      - '.github/workflows/vinted-clothing.yml'

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trainers Discord health check (silent)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ Trainers Discord webhook secret is missing."
            exit 1
          fi
          echo "🟢 Trainers Discord webhook configured. No Discord health message will be sent."

      - name: Run Nike Trainers Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          deadline=$((SECONDS + 260))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Trainers radar cycle $cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $remaining; fi
          done

      - name: Save trainers radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Nike trainers radar state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              echo "State-file conflict detected; resolving in favour of this radar run's state."
              git checkout --theirs vinted-radar/state.json
              git add vinted-radar/state.json
              GIT_EDITOR=true git rebase --continue
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep 3
          done
          exit 1
