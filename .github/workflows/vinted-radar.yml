name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate radar code
        run: |
          node --check vinted-radar/radar-core.mjs
          node --check vinted-radar/run-bot.mjs
          node --check vinted-radar/radar-selftest.mjs
          node vinted-radar/radar-selftest.mjs

      - name: Validate trainers Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          curl --fail --silent --show-error "$DISCORD_WEBHOOK_URL" >/dev/null

      - name: Run trainers radar repeatedly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          deadline=$((SECONDS + 250))
          successes=0
          failures=0
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            cycle_start=$SECONDS
            echo "=== Trainer scan cycle $cycle ==="
            if node vinted-radar/run-bot.mjs; then
              successes=$((successes + 1))
              node -e "const s=require('./vinted-radar/state.json'); console.log('Trainer scan OK:', s.freshness?.lastScanAt, 'searches:', s.diagnostics?.successfulSearches ?? '?', '/', s.diagnostics?.searchGroups ?? '?', 'fresh:', s.diagnostics?.freshItems ?? '?', 'alerts:', s.diagnostics?.qualifyingAlerts ?? '?')"
            else
              failures=$((failures + 1))
              echo "Trainer scan cycle $cycle FAILED."
            fi
            elapsed=$((SECONDS - cycle_start))
            wait=$((30 - elapsed))
            if [ $wait -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $wait; fi
          done
          echo "Trainer cycles complete: $successes successful, $failures failed."
          if [ $successes -eq 0 ]; then
            echo "All trainer scans failed. Marking workflow failed."
            exit 1
          fi

      - name: Save trainers radar state safely
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          cp vinted-radar/state.json /tmp/trainers-state.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ -f vinted-radar/state.json ]; then
              if node -e "const fs=require('fs'); const l=JSON.parse(fs.readFileSync('/tmp/trainers-state.json','utf8')); const r=JSON.parse(fs.readFileSync('vinted-radar/state.json','utf8')); const lt=Date.parse(l.updatedAt||l.freshness?.lastScanAt||0); const rt=Date.parse(r.updatedAt||r.freshness?.lastScanAt||0); process.exit(Number.isFinite(rt)&&Number.isFinite(lt)&&rt>lt?0:1)"; then
                echo "Remote trainer state is newer; refusing to overwrite it with stale run state."
                exit 0
              fi
            fi

            cp /tmp/trainers-state.json vinted-radar/state.json
            git add vinted-radar/state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Nike trainers radar state"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
