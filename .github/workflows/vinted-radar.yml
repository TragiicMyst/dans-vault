name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    # GitHub's minimum schedule interval is 5 minutes. Each scheduled run
    # performs the actual Vinted scan every 30 seconds while it is alive.
    - cron: '1-59/5 * * * *'

# Never kill a live 30-second scan loop just because the next scheduled run
# appears. If GitHub queues the next run, let it wait for the current one.
concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trainers Discord health check (silent)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ Trainers Discord webhook secret is missing."
            exit 1
          fi
          echo "🟢 Trainers Discord webhook configured. No Discord health message will be sent."

      - name: Run Nike Trainers Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: |
          # A GitHub schedule can only start every 5 minutes. Keep this job
          # alive for ~4m20s and scan every 30 seconds inside that window.
          deadline=$((SECONDS + 260))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Trainers radar cycle $cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then
              sleep $remaining
            fi
          done
          echo "=== Trainers radar 30-second loop finished; next scheduled run will continue automatically. ==="

      - name: Save trainers radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/state.json
          if git diff --cached --quiet; then
            echo "No trainer state changes."
            exit 0
          fi

          git commit -m "Update Nike trainers radar state"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Trainer radar state pushed successfully."
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "Could not push trainer radar state after 5 attempts."
          exit 1
