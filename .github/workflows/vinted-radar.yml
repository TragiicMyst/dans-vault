name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test Discord alert instead of checking Vinted'
        required: false
        default: false
        type: boolean

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Nike Trainers Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true && 'true' || 'false' }}
        run: |
          if [ "$TEST_MODE" = "true" ]; then
            node vinted-radar/run-bot.mjs
            exit 0
          fi

          # GitHub Actions schedules have a 5-minute minimum. Each scheduled
          # run therefore stays alive and scans repeatedly at ~30-second
          # intervals for as long as the job window allows.
          deadline=$((SECONDS + 275))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Trainers radar cycle $cycle ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then
              sleep $remaining
            fi
          done

      - name: Save trainers radar state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_mode == true) }}
        run: |
          git config user.name "Dan's Vault Trainers Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/state.json
          if git diff --cached --quiet; then
            echo "No trainer state changes."
            exit 0
          fi

          git commit -m "Update Nike trainers radar state"

          # Clothing and trainers write different state files on the same
          # branch, so their scheduled runs can overlap. Retry the rebase/push
          # if the other radar wins the race to origin/main.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Trainer radar state pushed successfully."
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "Could not push trainer radar state after 5 attempts."
          exit 1
