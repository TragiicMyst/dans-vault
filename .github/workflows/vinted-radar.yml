name: Dan's Vault Nike Trainers Radar

on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'vinted-radar/trainer-trigger.txt'

concurrency:
  group: dans-vault-trainers-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production trainer modules
        run: |
          set -e
          bash -n vinted-radar/cycle-runner.sh
          node --check vinted-radar/fetch-guard.mjs
          node --check vinted-radar/radar-v6.mjs
          node --check vinted-radar/expanded-trainer-radar.mjs
          node --check vinted-radar/trainer-discovery-hardening.mjs
          node --check vinted-radar/condition-tier-expansion.mjs
          node --check vinted-radar/condition-fallback.mjs
          node --check vinted-radar/trainer-throughput.mjs
          node --check vinted-radar/reliability-budget.mjs
          node --check vinted-radar/seller-safety.mjs
          node --check vinted-radar/trainer-alert-balance.mjs
          node --check vinted-radar/all-nike-opportunities.mjs
          node --check vinted-radar/priority-catchall.mjs
          node --check vinted-radar/condition-channel-routing.mjs
          node --check vinted-radar/discord-route-resolver.mjs
          node --check vinted-radar/listing-image-embed.mjs
          node --check vinted-radar/run-bot.mjs

      - name: Validate Discord condition webhooks
        env:
          DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL }}
          DISCORD_NEW_WITH_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL }}
          DISCORD_VERY_GOOD_WEBHOOK_URL: ${{ secrets.DISCORD_VERY_GOOD_WEBHOOK_URL }}
        run: |
          set -e
          test -n "$DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL"
          test -n "$DISCORD_NEW_WITH_TAGS_WEBHOOK_URL"
          test -n "$DISCORD_VERY_GOOD_WEBHOOK_URL"
          node --input-type=module <<'NODE'
          import { resolveDiscordRoutes } from './vinted-radar/discord-route-resolver.mjs';
          await resolveDiscordRoutes({
            newWithoutTagsWebhook: process.env.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL,
            newWithTagsWebhook: process.env.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL,
            veryGoodWebhook: process.env.DISCORD_VERY_GOOD_WEBHOOK_URL
          });
          NODE

      - name: Run resilient trainer worker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITHOUT_TAGS_WEBHOOK_URL }}
          DISCORD_NEW_WITH_TAGS_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_WITH_TAGS_WEBHOOK_URL }}
          DISCORD_VERY_GOOD_WEBHOOK_URL: ${{ secrets.DISCORD_VERY_GOOD_WEBHOOK_URL }}
          BOT_TYPE: trainers
          STATE_NAME: state.json
        run: bash vinted-radar/cycle-runner.sh trainers state.json trainer-health.json "Dan's Vault Trainers Radar" 3 300
