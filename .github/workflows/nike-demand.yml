name: Dan's Vault Nike Current Demand

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dans-vault-nike-demand
  cancel-in-progress: true

jobs:
  demand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Nike demand radar
        env:
          DISCORD_DEMAND_WEBHOOK_URL: ${{ secrets.DISCORD_DEMAND_WEBHOOK_URL }}
        run: node vinted-radar/demand.mjs

      - name: Save demand history
        run: |
          git config user.name "Dan's Vault Demand Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/demand-state.json
          if git diff --cached --quiet; then
            echo "No demand-state changes."
          else
            git commit -m "Update Nike demand radar state"
            git push
          fi
