name: Register Discord Price Command

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register /price globally
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_BOT_TOKEN"
          curl -fsS -X PUT \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/applications/1540760564215586936/commands" \
            --data-binary @- <<'JSON'
          [
            {
              "name": "price",
              "description": "Check a Nike item's resale potential",
              "type": 1,
              "options": [
                {
                  "name": "model",
                  "description": "Nike model",
                  "type": 3,
                  "required": true,
                  "choices": [
                    {"name": "Nike P-6000", "value": "p6000"},
                    {"name": "Nike Vomero", "value": "vomero"},
                    {"name": "Nike TN", "value": "tn"}
                  ]
                },
                {
                  "name": "size",
                  "description": "UK size",
                  "type": 4,
                  "required": true,
                  "min_value": 7,
                  "max_value": 10
                },
                {
                  "name": "buy_price",
                  "description": "Your purchase price in GBP",
                  "type": 10,
                  "required": true,
                  "min_value": 0.01,
                  "max_value": 500
                }
              ]
            }
          ]
          JSON
