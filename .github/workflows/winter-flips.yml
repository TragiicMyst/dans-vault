name: Dan's Vault Winter Flips Radar

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a live scan, send a test alert, or allocate bankroll'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - test
          - allocate
      bankroll:
        description: 'Bankroll in GBP for allocate mode'
        required: false
        default: '200'
        type: string
  push:
    paths:
      - 'winter-flips/test-trigger.txt'
  pull_request:
    paths:
      - 'winter-flips/**'
      - '.github/workflows/winter-flips.yml'

concurrency:
  group: dans-vault-winter-flips
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  winter-flips:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Winter Flips modules
        run: |
          set -e
          node --check winter-flips/engine.mjs
          node --check winter-flips/freshness-patch.mjs
          node --check winter-flips/bargain-hunter.mjs
          node --check winter-flips/intelligence.mjs
          node --check winter-flips/test-alert.mjs
          node --check winter-flips/capital-allocator.mjs
          node -e "JSON.parse(require('fs').readFileSync('winter-flips/config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('winter-flips/state.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('winter-flips/intelligence-state.json','utf8'))"
          bash -n winter-flips/run-cycle.sh

      - name: Check dedicated Discord webhook
        id: gate
        env:
          DISCORD_WINTER_FLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_WINTER_FLIPS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WINTER_FLIPS_WEBHOOK_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dedicated Winter Flips webhook is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DISCORD_WINTER_FLIPS_WEBHOOK_URL is not configured yet; live actions will be skipped."
          fi

      - name: Send dedicated-channel test alert
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          DISCORD_WINTER_FLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_WINTER_FLIPS_WEBHOOK_URL }}
        run: node winter-flips/test-alert.mjs

      - name: Send bankroll allocation
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'allocate'
        env:
          DISCORD_WINTER_FLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_WINTER_FLIPS_WEBHOOK_URL }}
        run: node winter-flips/capital-allocator.mjs "${{ inputs.bankroll }}"

      - name: Run Vinted Winter Flips radar
        if: steps.gate.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan'))
        env:
          DISCORD_WINTER_FLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_WINTER_FLIPS_WEBHOOK_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bash winter-flips/run-cycle.sh 1 0 105
          else
            bash winter-flips/run-cycle.sh 3 180 105
          fi
