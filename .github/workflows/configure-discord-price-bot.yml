name: Configure Discord Price Bot

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force configuration update'
        required: false
        default: false
        type: boolean

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Discord Price Bot
        run: node configure-discord-price-bot.mjs
