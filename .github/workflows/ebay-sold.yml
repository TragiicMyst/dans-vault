name: Dan's Vault eBay Sold Trainers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run eBay sold analyzer
        run: |
          mkdir -p ebay-sold/data
          node ebay-sold/analyze.mjs > ebay-sold/latest-report.json

      - name: Send report to Discord
        env:
          DISCORD_EBAY_SOLD_WEBHOOK_URL: ${{ secrets.DISCORD_EBAY_SOLD_WEBHOOK_URL }}
        run: node ebay-sold/send-discord.mjs

      - name: Save latest report
        run: |
          git config user.name "Dan's Vault eBay Sold"
          git config user.email "actions@users.noreply.github.com"
          git add ebay-sold/latest-report.json
          if git diff --cached --quiet; then
            echo "No report file changes."
          else
            git commit -m "Update eBay sold trainer report"
            git push
          fi
