name: Dan's Vault Nike Clothing Radar

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

concurrency:
  group: dans-vault-clothing-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate clothing Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          curl --fail --silent --show-error "$DISCORD_WEBHOOK_URL" >/dev/null

      - name: Enable immediate clothing alerts
        run: node vinted-radar/enable-live-alerts.mjs clothing

      - name: Run clothing radar repeatedly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
          BOT_TYPE: clothing
          STATE_NAME: clothing-state.json
        run: |
          deadline=$((SECONDS + 250))
          while [ $SECONDS -lt $deadline ]; do
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Clothing scan failed; retrying next cycle."
            elapsed=$((SECONDS - cycle_start))
            wait=$((30 - elapsed))
            if [ $wait -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $wait; fi
          done

      - name: Save clothing radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Clothing Radar"
          git config user.email "actions@users.noreply.github.com"
          cp vinted-radar/clothing-state.json /tmp/clothing-state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/clothing-state.json vinted-radar/clothing-state.json
            git add vinted-radar/clothing-state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Nike clothing radar state"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
