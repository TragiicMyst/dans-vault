name: Dan's Vault Nike Clothing Radar

on:
  schedule:
    - cron: '3-59/5 * * * *'
  push:
    paths:
      - 'vinted-radar/run-bot.mjs'
      - 'vinted-radar/monitor.mjs'
      - 'vinted-radar/config.json'
      - '.github/workflows/vinted-clothing.yml'
      - '.github/workflows/vinted-radar.yml'

concurrency:
  group: dans-vault-clothing-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clothing Discord health check (silent)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ Clothing Discord webhook secret is missing."
            exit 1
          fi
          echo "🟢 Clothing Discord webhook configured. No Discord health message will be sent."

      - name: Run Nike Clothing Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
          BOT_TYPE: clothing
          STATE_NAME: clothing-state.json
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "=== Fast clothing validation scan ==="
            node vinted-radar/run-bot.mjs
            exit 0
          fi

          deadline=$((SECONDS + 260))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Clothing radar cycle $cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then sleep $remaining; fi
          done

      - name: Save clothing radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Clothing Radar"
          git config user.email "actions@users.noreply.github.com"
          cp vinted-radar/clothing-state.json /tmp/clothing-state.json

          for attempt in 1 2 3 4 5; do
            echo "State save attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/clothing-state.json vinted-radar/clothing-state.json
            git add vinted-radar/clothing-state.json

            if git diff --cached --quiet; then
              echo "No clothing state changes to save."
              exit 0
            fi

            git commit -m "Update Nike clothing radar state"
            if git push origin HEAD:main; then
              echo "✅ Clothing radar state saved."
              exit 0
            fi

            echo "Push raced another workflow; retrying from newest main."
            sleep 2
          done

          echo "❌ Could not save clothing radar state after 5 attempts."
          exit 1
