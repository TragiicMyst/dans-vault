name: Dan's Vault Nike Clothing Radar

on:
  schedule:
    # GitHub's minimum schedule interval is 5 minutes. Each scheduled run
    # performs the actual Vinted scan every 30 seconds while it is alive.
    - cron: '3-59/5 * * * *'

# Never kill a live 30-second scan loop just because the next scheduled run
# appears. If GitHub queues the next run, let it wait for the current one.
concurrency:
  group: dans-vault-clothing-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clothing Discord health check (silent)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ Clothing Discord webhook secret is missing."
            exit 1
          fi
          echo "🟢 Clothing Discord webhook configured. No Discord health message will be sent."

      - name: Run Nike Clothing Radar every 30 seconds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOTHING_WEBHOOK_URL }}
          BOT_TYPE: clothing
          STATE_NAME: clothing-state.json
        run: |
          # A GitHub schedule can only start every 5 minutes. Keep this job
          # alive for ~4m20s and scan every 30 seconds inside that window.
          deadline=$((SECONDS + 260))
          cycle=0
          while [ $SECONDS -lt $deadline ]; do
            cycle=$((cycle + 1))
            echo "=== Clothing radar cycle $cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            cycle_start=$SECONDS
            node vinted-radar/run-bot.mjs || echo "Radar scan failed; continuing to next 30s cycle."
            elapsed=$((SECONDS - cycle_start))
            remaining=$((30 - elapsed))
            if [ $remaining -gt 0 ] && [ $SECONDS -lt $deadline ]; then
              sleep $remaining
            fi
          done
          echo "=== Clothing radar 30-second loop finished; next scheduled run will continue automatically. ==="

      - name: Save clothing radar state
        if: ${{ always() }}
        run: |
          git config user.name "Dan's Vault Clothing Radar"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/clothing-state.json
          if git diff --cached --quiet; then
            echo "No clothing state changes."
            exit 0
          fi

          git commit -m "Update Nike clothing radar state"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Clothing radar state pushed successfully."
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "Could not push clothing state after 5 attempts."
          exit 1
