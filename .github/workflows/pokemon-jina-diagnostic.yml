name: Pokemon Centre Source Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'pokemon-center/jina-diag-trigger.txt'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: node pokemon-center/hotstock-diagnostic.mjs
