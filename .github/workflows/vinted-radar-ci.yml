name: Dan's Vault Vinted Radar CI

on:
  push:
    branches:
      - main
    paths:
      - 'vinted-radar/*.mjs'
      - '.github/workflows/vinted-radar.yml'
      - '.github/workflows/vinted-clothing.yml'
      - '.github/workflows/vinted-radar-ci.yml'
  pull_request:
    paths:
      - 'vinted-radar/*.mjs'
      - '.github/workflows/vinted-radar.yml'
      - '.github/workflows/vinted-clothing.yml'
      - '.github/workflows/vinted-radar-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate radar v6 code
        run: |
          set -e
          node --check vinted-radar/fetch-guard.mjs
          node --check vinted-radar/radar-v6.mjs
          node --check vinted-radar/run-bot.mjs
          node --check vinted-radar/radar-selftest.mjs
          node vinted-radar/radar-selftest.mjs
