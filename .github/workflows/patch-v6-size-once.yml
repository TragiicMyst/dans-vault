name: Dan's Vault Apply V6 Size Fix

on:
  push:
    branches:
      - main
    paths:
      - 'vinted-radar/patch-v6-size-once.mjs'
      - '.github/workflows/patch-v6-size-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply permanent source fix and verify
        run: |
          set -e
          node vinted-radar/patch-v6-size-once.mjs
          node --check vinted-radar/radar-v6.mjs
          node vinted-radar/radar-selftest.mjs

      - name: Commit fixed engine
        run: |
          git config user.name "Dan's Vault Radar Fix"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-radar/radar-v6.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix v6 bare Vinted size parsing"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
